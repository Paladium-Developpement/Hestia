name: Build

on:
  push:
  pull_request:

permissions:
  contents: read
  checks: write

env:
  GRADLE_ARGS: -Porg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 8 and 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: chmod +x gradlew && ./gradlew test $GRADLE_ARGS
      - name: Integration tests
        run: ./gradlew integrationTest $GRADLE_ARGS
      - name: Build
        run: ./gradlew assemble $GRADLE_ARGS
      - name: Test report
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: build/test-results/**/*.xml
          check_name: Test report
          include_passed: true